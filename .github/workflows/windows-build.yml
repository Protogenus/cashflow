name: Windows build

# Builds the Windows deliverables on a real Windows runner:
#  - portable zip (cashflow-<version>.zip, extract + START_CASHFLOW.bat)
#  - NSIS installer (release/Cashflow Setup <version>.exe)
# Public repo = unlimited free Actions minutes, so every push to master is built.
# Note: Cashflow has no native modules, so no electron-rebuild step is needed.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package for Windows (portable zip + NSIS installer)
        # Repo config is zip-only (nsis needs a real Windows runner for code
        # signing metadata; both targets build fine there). The package.json
        # patch is NOT committed.
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.win.target=['zip','nsis'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm run dist

      - name: Assemble portable deliverable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version")
          $ebZip = "release/Cashflow-$version-win.zip"
          if (-not (Test-Path $ebZip)) { throw "electron-builder zip not found: $ebZip" }
          if (-not (Test-Path 'release-staging/START_CASHFLOW.bat')) { throw 'launcher bat missing' }
          Expand-Archive -Path $ebZip -DestinationPath 'release-staging' -Force
          if (-not (Test-Path 'release-staging/win-unpacked/Cashflow.exe')) { throw 'Cashflow.exe missing after extract' }
          if (-not (Test-Path 'release-staging/resources/app.asar')) { throw 'app.asar missing' }
          $out = "cashflow-$version.zip"
          if (Test-Path $out) { Remove-Item $out }
          Compress-Archive -Path 'release-staging/*' -DestinationPath $out
          Get-Item $out | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-windows
          path: |
            cashflow-*.zip
            release/*.exe
          if-no-files-found: error
